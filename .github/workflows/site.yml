name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      versao_treinos:
        description: "Release tag for treinos for this run only (empty = pin or newest). To make a rollback stick, set the repo variable PIN_TREINOS"
        required: false
      versao_adm:
        description: "Release tag for adm for this run only (empty = pin or newest). To make a rollback stick, set the repo variable PIN_ADM"
        required: false
  repository_dispatch:
    types: [parte-atualizada]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publicadas: ${{ steps.montar.outputs.publicadas }}
    steps:
      - uses: actions/checkout@v4
      - name: Test version choice (regression for the 18/11 race)
        run: bash .github/tests/test_montar_site.sh
      - name: Assemble site (cover + parts from releases)
        id: montar
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO_TREINOS: ${{ inputs.versao_treinos }}
          VERSAO_ADM: ${{ inputs.versao_adm }}
          PIN_TREINOS: ${{ vars.PIN_TREINOS }}
          PIN_ADM: ${{ vars.PIN_ADM }}
          DISPATCH_PARTE: ${{ github.event.client_payload.parte }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
        run: bash .github/scripts/montar_site.sh _site
      - name: Check HTML, internal links and data-like files
        run: python3 .github/scripts/check_site.py _site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Is the live site the version this run published? Each page must answer 200
  # and match the deployed file (Pages artifact), with retries for the CDN cache.
  # A red run on main wakes the owner.
  no-ar:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: luanharaujo/web-quality-kit/actions/web-live@v1
        with:
          base-url: https://duoluma.com.br
          pages-artifact: "true"
          paths: / /treinos/ /adm/ /adm/versao.json

  prune:
    # Keep the 10 newest versions of each part (older ones can't be rolled back to).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLICADAS: ${{ needs.check.outputs.publicadas }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - run: |
          set -euo pipefail
          lista="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]')"
          for parte in treinos adm; do
            # Same ordering as montar_site.sh (published_at, not created_at).
            jq -s -r --arg parte "$parte" -f .github/scripts/versoes.jq <<<"$lista" | tac | tail -n +11 |
            while read -r tag; do
              # Never delete a version that is live right now (e.g. after a rollback).
              case " $PUBLICADAS " in *" $tag "*) echo "keep live $tag"; continue;; esac
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done
          done
