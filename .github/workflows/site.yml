name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      versao_treinos:
        description: "Release tag for treinos (empty = newest), e.g. parte-treinos-1a2b3c4"
        required: false
      versao_adm:
        description: "Release tag for adm (empty = newest), e.g. parte-adm-1a2b3c4"
        required: false
  repository_dispatch:
    types: [parte-atualizada]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publicadas: ${{ steps.montar.outputs.publicadas }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (cover + parts from releases)
        id: montar
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO_TREINOS: ${{ inputs.versao_treinos || (github.event.client_payload.parte == 'treinos' && github.event.client_payload.tag) || '' }}
          VERSAO_ADM: ${{ inputs.versao_adm || (github.event.client_payload.parte == 'adm' && github.event.client_payload.tag) || '' }}
        run: bash .github/scripts/montar_site.sh _site
      - name: Check HTML, internal links and data-like files
        run: python3 .github/scripts/check_site.py _site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Is the live site the version this run published? Each page must answer 200
  # and match the deployed file (Pages artifact), with retries for the CDN cache.
  # A red run on main wakes the owner.
  no-ar:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: luanharaujo/web-quality-kit/actions/web-live@v1.1.0
        with:
          base-url: https://duoluma.com.br
          pages-artifact: "true"
          paths: / /treinos/ /adm/ /adm/versao.json

  prune:
    # Keep the 10 newest versions of each part (older ones can't be rolled back to).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLICADAS: ${{ needs.check.outputs.publicadas }}
    steps:
      - run: |
          set -euo pipefail
          lista="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt)"
          for parte in treinos adm; do
            jq -r --arg p "parte-$parte-" \
              '[.[] | select(.tagName | startswith($p))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' <<<"$lista" |
            while read -r tag; do
              # Never delete a version that is live right now (e.g. after a rollback).
              case " $PUBLICADAS " in *" $tag "*) echo "keep live $tag"; continue;; esac
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done
          done
