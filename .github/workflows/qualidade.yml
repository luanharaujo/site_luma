# Health panel (web-quality-kit): valid HTML, broken links, Lighthouse with axe
# and personal data (repository and assembled site), compared with main
# ("never worse"). Starts as a baseline: what already exists only warns.
# treinos/ and adm/ have their own panels in their source repositories.
name: qualidade

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-health:
    runs-on: ubuntu-latest   # public repository: always GitHub's machine
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read   # main's health numbers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Assemble site (cover + parts from releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/montar_site.sh _site
      - uses: luanharaujo/web-quality-kit/actions/web-ci@b5b61e77b632badb479fd16e0c62e102f81eb8f0 # v1.25.1
        with:
          lang: pt
          html-globs: index.html
          site-dir: _site
          lighthouse-paths: /
          data-guard: "true"
