# Detection only, never blocks. A pull request must be opened by the agents' GitHub App.
# If the author is anyone else, label it "outside the flow" and leave one short comment. It has no secrets and never
# checks out PR code (pull_request_target runs main's copy of this file). A failure here only
# shows as a red step in this workflow; it is not a required check and the queue ignores it.
name: Outside the flow

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  issues: write

jobs:
  detect:
    if: >-
      github.event.pull_request.user.login != 'luanharaujo-agents[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    continue-on-error: true
    steps:
      - name: Label and comment once
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          gh label create "outside the flow" -R "$REPO" --color d93f0b \
            --description "PR not opened by the agents' App" 2>/dev/null || true
          gh pr edit "$PR" -R "$REPO" --add-label "outside the flow"
          if gh pr view "$PR" -R "$REPO" --json comments --jq '.comments[].body' | grep -q 'outside-the-flow-marker'; then
            exit 0
          fi
          gh pr comment "$PR" -R "$REPO" --body "<!-- outside-the-flow-marker -->
          **Outside the flow.** This PR was opened by \`$AUTHOR\`, not by the agents' App. So the author is the repository owner (who then cannot approve it), and the PR has no requested reviewer and no registered owner for CI notices. **What to do:** close this PR and reopen the same branch through the agents' App. This notice only detects; it blocks nothing."
