# Weekly dependency updates. New versions wait 7 days (cooldown); security fixes skip the wait.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The canary distributes the kit's updates.
      - dependency-name: "luanharaujo/web-quality-kit/*"
    open-pull-requests-limit: 3
